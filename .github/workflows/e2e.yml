# Uçtan uca (E2E) test: gerçek servisleri (ai-core + backend + web) ayağa
# kaldırır, demo verisini seed eder ve Playwright ile jüri demo akışını koşar.
name: E2E (Playwright)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PULSAR_ENV: development
      DATABASE_URL: sqlite:///./e2e.db
      AI_CORE_URL: http://localhost:8001
      NEXT_PUBLIC_API_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements-ci.txt

      - name: Start ai-core (8001)
        run: |
          cd ai-core
          PYTHONPATH="$PWD" nohup uvicorn app.main:app --port 8001 > ../ai-core.log 2>&1 &

      - name: Start backend (8000)
        run: |
          nohup uvicorn app.main:app --app-dir backend --port 8000 > backend.log 2>&1 &

      - name: Wait for API services
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8001/health >/dev/null && \
               curl -sf http://localhost:8000/health >/dev/null; then
              echo "API services up"; break
            fi
            sleep 2
          done
          curl -sf http://localhost:8001/health && echo " ai-core ok"
          curl -sf http://localhost:8000/health && echo " backend ok"

      - name: Seed demo users
        run: PYTHONPATH=backend python backend/scripts/seed.py

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Start frontend (3000)
        working-directory: frontend
        run: nohup npm run start > ../frontend.log 2>&1 &

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Wait for frontend
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/health >/dev/null; then
              echo "web up"; break
            fi
            sleep 2
          done
          curl -sf http://localhost:3000/health && echo " web ok"

      - name: Run Playwright E2E
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: npx playwright test

      - name: Service logs (on failure)
        if: failure()
        run: |
          echo "===== backend.log ====="; tail -n 100 backend.log || true
          echo "===== ai-core.log ====="; tail -n 100 ai-core.log || true
          echo "===== frontend.log ====="; tail -n 100 frontend.log || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
