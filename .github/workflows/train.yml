name: Teknofest-Eval
on:
  push:
    branches: [main]
  workflow_dispatch:

# Model/metric artifact'lari main dalina DOGRUDAN commit EDILMEZ; surumleme
# ve inceleme icin artifact olarak yuklenir (release/PR sureci ile yayinlanir).
permissions:
  contents: read

concurrency:
  group: teknofest-eval
  cancel-in-progress: false

jobs:
  evaluate:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 540
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache raw ECG data
        uses: actions/cache@v4
        with:
          path: data/ecg/raw
          key: ecgraw-${{ hashFiles('data/ecg/selected.jsonl') }}

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements-ci.txt

      - name: Tests (ai-core)
        run: |
          cd ai-core
          PYTHONPATH="$PWD" python -m pytest tests/ -q

      - name: Tests (backend)
        run: |
          cd backend
          PYTHONPATH="$PWD" python -m pytest tests/ -q

      - name: Tests (anonymizer)
        run: |
          cd anonymizer
          PYTHONPATH="$PWD/pii_nlp:$PWD/dicom_cleaner:$PWD/ecg_deid" \
            python -m pytest tests/ -q

      - name: Fetch data
        run: |
          cd ai-core
          python -m app.ecg.data fetch --data-dir ../data/ecg --concurrency 64

      - name: Build cache
        run: |
          cd ai-core
          python -m app.ecg.train build-cache --data-dir ../data/ecg

      - name: Baseline
        run: |
          cd ai-core
          python -m app.ecg.train baseline --data-dir ../data/ecg

      - name: Deep training (folds=5, focal)
        run: |
          cd ai-core
          python -m app.ecg.train deep --data-dir ../data/ecg --epochs 30 --loss focal --folds 5

      - name: Robustness
        run: |
          cd ai-core
          python -m app.ecg.train robustness --data-dir ../data/ecg

      - name: Stage-2 (fine-grained)
        run: |
          cd ai-core
          python -m app.ecg.train stage2 --data-dir ../data/ecg --epochs-stage2 15

      - name: Upload artifacts (model + metrikler + figurler)
        uses: actions/upload-artifact@v4
        with:
          name: teknofest-ecg-eval
          if-no-files-found: warn
          retention-days: 90
          path: |
            ai-core/models/ecg_resnet.pt
            ai-core/models/ecg_config.json
            docs/figures/**
            docs/metrics/**