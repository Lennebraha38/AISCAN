[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsar-kkds-dicom-cleaner"
version = "0.1.0"
description = "Client-side DICOM anonymization primitives"
requires-python = ">=3.11"
dependencies = ["pydicom>=2.4,<4.0"]

[tool.setuptools.packages.find]
include = ["dicom_cleaner*"]
