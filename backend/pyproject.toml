[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsar-kkds-backend"
version = "0.1.0"
description = "Pulsar-KKDS decision-support API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "reportlab>=4.2,<6.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "python-jose[cryptography]>=3.3,<4.0",
  "httpx>=0.27,<1.0",
  "python-multipart>=0.0.7",
  "pydantic>=2.0,<3.0",
  "email-validator>=2.0",
  "psycopg2-binary>=2.9,<3.0",
  "scipy>=1.10,<2.0",
  "numpy>=1.24,<3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
