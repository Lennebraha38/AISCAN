[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsar-kkds-ai-core"
version = "0.1.0"
description = "Pulsar-KKDS inference and explainability service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pyyaml>=6.0,<7.0",
  "numpy>=1.24,<3.0",
  "scipy>=1.10,<2.0",
  "pillow>=10.0,<12.0",
  "httpx>=0.27,<1.0",
  "torch>=2.0,<3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
